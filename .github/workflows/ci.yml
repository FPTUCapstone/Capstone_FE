name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # NEXT_PUBLIC_* values are public Firebase Web App config (not secrets) —
          # see src/lib/firebaseConfig.ts. Fallback defaults prevent static prerender failures.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyBUc3eDPm680W-85UYFItx8uzSkY9Wn9J0' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: tripmate-82be3.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: tripmate-82be3
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: tripmate-82be3.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '105500206516'
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || '1:105500206516:web:a8e1f0ec0a5c31ddd57ee1' }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID || 'G-4PW5RELNHD' }}
